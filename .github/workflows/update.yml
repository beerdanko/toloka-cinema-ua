name: Update Toloka Cinema UA
on:
  workflow_dispatch:
  schedule:
    # Sundays, 08:23 UTC (roughly 10:23 or 11:23 in Ukraine)
    - cron: '23 8 * * 0'
permissions:
  contents: write
concurrency:
  group: toloka-cinema-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test parser
        run: python -m unittest discover -s tests -v
      - name: Generate catalog
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: python build_catalog.py --pages 18 --max-items 60
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/state.json data/report.json
          git diff --staged --quiet || { git commit -m 'Update Ukrainian movie catalog'; git push; }
